<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal AI Chat Blueprint</title>
  <!-- Tailwind CSS: Used for rapid styling, ensuring the chat UI is responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Importing fonts to match the aesthetic of your portfolio site */
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;700&display=swap');

    /* Design Tokens: Mapping site-wide variables to local styles */
    :root {
      --bg: #0e0d0b;
      --bg-raised: #151410;
      --text: #f0ede8;
      --muted: #7a7670;
      --accent: #c8622a;
      --border: #232220;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    .custom-border { border: 1px solid var(--border); }
    .custom-bg { background-color: var(--bg-raised); }
    .accent-text { color: var(--accent); }
    .muted-text { color: var(--muted); }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-6">

  <main class="max-w-3xl w-full">
    <!-- Main Chat Container: The surface where the interaction happens -->
    <div class="custom-bg custom-border rounded-lg overflow-hidden h-[650px] flex flex-col shadow-2xl">
      
      <!-- Header: Provides visual context for the session -->
      <div class="px-6 py-4 border-b border-[#232220] flex items-center justify-between">
        <h2 class="text-[0.75rem] uppercase tracking-widest muted-text mono">AI Development Coach</h2>
        <div class="h-2 w-2 rounded-full bg-green-700 animate-pulse"></div>
      </div>

      <!-- Chat Viewport: Dynamically populated container for conversation turns -->
      <div id="chat-stream" class="flex-1 overflow-y-auto p-6 space-y-6">
        <div class="muted-text text-sm">System Ready. You can attach code snippets or screenshots for context.</div>
      </div>

      <!-- Input Area: Houses form controls for user interactions -->
      <div class="p-4 border-t border-[#232220] bg-[#0e0d0b]">
        <form onsubmit="handleFormSubmission(event)" class="flex flex-col gap-3">
          <!-- Snippet Area: Captures code block inputs for context injection -->
          <textarea 
            id="code-snippet" 
            placeholder="Paste code snippet here..." 
            class="w-full bg-[#151410] border border-[#232220] rounded p-3 text-[10px] text-[#f0ede8] focus:border-[var(--accent)] outline-none mono h-24 resize-none"
          ></textarea>
          
          <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="Ask your question..." class="flex-1 bg-[#151410] border border-[#232220] rounded px-4 py-2.5 text-xs text-[#f0ede8] focus:border-[var(--accent)] outline-none">
            <button type="submit" class="bg-[var(--accent)] hover:bg-[#a64f1d] px-6 py-2 rounded text-[10px] font-bold uppercase tracking-widest text-[#0e0d0b] transition">Send</button>
          </div>
          
          <!-- File Handling: Trigger for image uploads (screenshots) -->
          <div class="flex items-center gap-4">
            <input type="file" id="file-upload" accept="image/*" class="hidden">
            <label for="file-upload" class="cursor-pointer text-[10px] muted-text hover:accent-text uppercase font-mono transition">
              + Attach Screenshot
            </label>
            <span id="file-status" class="text-[9px] text-emerald-600 font-mono hidden">Image Loaded</span>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // State management: Stores the chat history so the AI "remembers" the conversation
    const apiKey = ""; // API Key placeholder
    let chatHistory = [];

    // Utility: Image encoding
    // Converts raw file object into a Base64 string that Gemini can parse
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // UI Feedback: Shows user that an image has been successfully staged
    document.getElementById('file-upload').addEventListener('change', (e) => {
      document.getElementById('file-status').classList.toggle('hidden', e.target.files.length === 0);
    });

    // API Pipeline: The core interaction logic
    // Aggregates history + text + optional images into the payload
    async function postToModel(userText, systemText, imageData = null) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      
      let parts = [{ text: userText }];
      if (imageData) {
        parts.push({ inlineData: { mimeType: "image/png", data: imageData } });
      }

      // Memory integration: Add current turn to history
      chatHistory.push({ role: "user", parts: parts });

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: chatHistory,
          systemInstruction: { parts: [{ text: systemText }] }
        })
      });

      const result = await response.json();
      const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
      
      // Memory integration: Add AI response to history
      chatHistory.push({ role: "model", parts: [{ text }] });
      return text;
    }

    // Interaction Coordinator: Handles UI state and prepares data for the API call
    async function handleFormSubmission(event) {
      event.preventDefault();
      
      const input = document.getElementById('user-input');
      const snippet = document.getElementById('code-snippet');
      const fileInput = document.getElementById('file-upload');
      const status = document.getElementById('file-status');
      
      // Prompt Engineering: Combine code block + main question for superior context
      let finalPrompt = input.value;
      if (snippet.value.trim()) {
        finalPrompt = `Reference Code:\n\`\`\`\n${snippet.value.trim()}\n\`\`\`\n\nQuestion: ${finalPrompt}`;
      }
      
      // Image extraction
      let imageData = null;
      if (fileInput.files.length > 0) {
        imageData = await getBase64(fileInput.files[0]);
      }
      
      // Render user turn to UI immediately for performance feedback
      renderMessage(input.value || "Analyzing...", 'user');
      
      // Clear inputs to reset the interface state
      input.value = '';
      snippet.value = '';
      fileInput.value = '';
      status.classList.add('hidden');

      // Async fetch to the model and render the AI response
      const response = await postToModel(finalPrompt, "You are a professional developer assistant.", imageData);
      renderMessage(response, 'ai');
    }

    // DOM Updater: Appends new content to the chat window
    function renderMessage(text, sender) {
      const stream = document.getElementById('chat-stream');
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'text-right' : 'text-left';
      div.innerHTML = `<p class="text-xs ${sender === 'user' ? 'text-[var(--accent)]' : 'text-[#f0ede8]'} leading-relaxed">${text.replace(/\n/g, '<br>')}</p>`;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight; // Auto-scroll to latest message
    }
  </script>
</body>
</html>
